[project]
name = "imgtoolkit"
version = "1.1.1"
description = "Suite desktop per gestire librerie di immagini: duplicati via CLIP+FAISS, revisione delle coppie, conversione in JPG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch",
    "open_clip_torch",
    "faiss-cpu",
    "numpy",
    "Pillow",
    "safetensors",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
